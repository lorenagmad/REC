<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>REC</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='40' fill='%23E8322B'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --stage:#12161C; --stage2:#1B212A; --paper:#F6F4EF; --ink:#15171C; --soft:#5D6470; --line:#D9D6CE;
  --rec:#E8322B; --y:#F2C200; --c:#00A6C8; --g:#2BB24C; --m:#C2188F; --b:#2747C9;
  --ok:#2BB24C; --display:"Archivo Black","Arial Black",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{font-family:var(--body);color:#fff;font-size:17px;line-height:1.45;min-height:100vh;
  background:radial-gradient(120% 80% at 50% 0%, #222a35 0%, var(--stage) 60%) fixed, var(--stage)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.022) 0 1px,transparent 1px 3px)}
button,input,select{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--y);outline-offset:3px}
.wrap{position:relative;z-index:1;max-width:880px;margin:0 auto;padding:20px 18px 96px}
.hidden{display:none!important}
/* visor de cámara: esquinas */
.vf{position:relative}
.vf::before,.vf::after{content:"";position:absolute;width:26px;height:26px;border:3px solid rgba(255,255,255,.55);pointer-events:none}
.vf::before{top:-10px;left:-10px;border-right:0;border-bottom:0}
.vf::after{bottom:-10px;right:-10px;border-left:0;border-top:0}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.recbadge{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-weight:700;letter-spacing:.08em;font-size:14px;color:#fff;background:rgba(255,255,255,.08);border-radius:999px;padding:6px 12px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--rec);box-shadow:0 0 12px var(--rec);animation:blink 1.2s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
.lang{display:flex;background:rgba(255,255,255,.08);border-radius:999px;padding:3px}
.lang button{border:0;background:none;color:#fff;font-weight:700;border-radius:999px;padding:5px 12px;font-size:14px}
.lang button[aria-pressed="true"]{background:#fff;color:var(--ink)}
.hero{padding:30px 26px 26px;border-radius:20px;background:linear-gradient(135deg,#202733,#151a21);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset}
.hero .course{margin:0;font-size:clamp(15px,2.4vw,19px);font-weight:700;opacity:.9}
.showname{font-family:var(--display);font-size:clamp(64px,16vw,150px);line-height:.9;margin:6px 0 10px;letter-spacing:-.02em;display:flex;align-items:center;gap:.12em}
.showname .bigdot{width:.62em;height:.62em;border-radius:50%;background:var(--rec);box-shadow:0 0 30px rgba(232,50,43,.7);flex:none}
.bars{display:flex;height:10px;border-radius:5px;overflow:hidden;max-width:420px}
.bars i{flex:1}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--paper);color:var(--ink);font-weight:700;padding:7px 14px;border-radius:999px;font-size:15px;max-width:100%}
.hostline{display:flex;gap:14px;align-items:flex-end;margin-top:22px}
.hostline svg{flex:none;width:86px;height:auto}
.bubble{position:relative;background:var(--paper);color:var(--ink);border-radius:16px 16px 16px 4px;padding:14px 16px;font-size:16px}
.sectitle{font-family:var(--display);font-size:clamp(20px,3.6vw,28px);margin:30px 0 12px;line-height:1.1}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:0;padding:0;list-style:none;counter-reset:st}
.howto li{background:var(--paper);color:var(--ink);border-radius:14px;padding:16px 16px 16px 58px;position:relative;font-size:15.5px}
.howto li::before{counter-increment:st;content:counter(st);position:absolute;left:14px;top:14px;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-family:var(--display);background:var(--ink);color:#fff}
.howto li:nth-child(5n+1)::before{background:var(--y);color:var(--ink)}.howto li:nth-child(5n+2)::before{background:var(--c)}.howto li:nth-child(5n+3)::before{background:var(--g)}.howto li:nth-child(5n+4)::before{background:var(--m)}.howto li:nth-child(5n+5)::before{background:var(--rec)}
.howto b{display:block;margin-bottom:2px}
.block{display:grid;gap:10px;margin-top:22px}
.block h3{margin:0;font-family:var(--display);font-size:18px}
.block h3 span{background:#fff;color:var(--ink);border-radius:8px;padding:2px 10px;font-size:15px}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.qitem{display:grid;gap:6px}
.qcard{display:grid;gap:4px;text-align:left;border:0;border-radius:14px;padding:14px 16px;background:var(--paper);color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.35);transition:transform .08s;position:relative;overflow:hidden}
.qcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.qcard.global::before{background:var(--rec)}
.qcard:hover{transform:translateY(-2px)}
.qcard .t{font-family:var(--display);font-size:17px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.qcard .d{font-size:14.5px;color:var(--soft)}
.qcard .m{font-size:13px;color:var(--soft);font-weight:700}
.tagdone,.tagoff{font-family:var(--body);font-size:12px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap;background:var(--g);color:#fff}
.tagoff{background:var(--ink)}
.qprac{border:0;border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px;background:rgba(255,255,255,.1);color:#fff;text-align:left}
.qprac:hover{background:rgba(255,255,255,.18)}
.homefoot{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:center;font-size:13.5px;opacity:.85;margin-top:30px}
.linkish{background:none;border:0;color:#fff;text-decoration:underline;padding:0;font-size:14px}
.panel{background:var(--paper);color:var(--ink);border-radius:18px;padding:22px;display:grid;gap:16px}
.fields{display:grid;grid-template-columns:1.6fr 1fr;gap:12px}
@media (max-width:560px){.fields{grid-template-columns:1fr}}
label{display:grid;gap:6px;font-weight:700;font-size:14px}
input[type=text]{border:2px solid var(--line);border-radius:10px;padding:12px 14px;font-size:17px;color:var(--ink);background:#fff;width:100%}
input[type=text]:focus{border-color:var(--ink);outline:none}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0;padding:0;list-style:none}
@media (max-width:560px){.rules{grid-template-columns:1fr}}
.rules li{background:#ECE9E1;border-radius:12px;padding:12px 14px;font-size:14.5px;color:var(--soft)}
.rules b{display:block;color:var(--ink);font-family:var(--display);font-size:19px;margin-bottom:2px}
.btn{border:0;border-radius:12px;padding:14px 22px;font-weight:700;font-size:17px;background:var(--ink);color:#fff}
.btn:hover{background:#000}
.btn.big{font-family:var(--display);font-size:20px;padding:18px 26px;width:100%;background:var(--rec)}
.btn.big:hover{background:#c9241e}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.backbtn{background:none;border:0;color:#fff;font-weight:700;padding:6px 0;font-size:15px;justify-self:start;margin-bottom:12px}
.err{color:#B0121F;font-weight:700;font-size:14px;min-height:1em;margin:0}
.note{margin:0;font-size:14.5px;color:var(--soft)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
details.extra{background:#ECE9E1;border-radius:12px;padding:10px 14px}
details.extra summary{cursor:pointer;font-weight:700;font-size:15px}
.practag{background:var(--y);color:var(--ink);border-radius:999px;padding:4px 12px;font-weight:700;font-size:14px}
/* pregunta */
.hud{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;font-weight:700}
.prog{display:flex;gap:4px;flex:1;max-width:420px}
.prog i{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.2)}
.prog i.done{background:#fff}.prog i.now{background:var(--rec)}
.hudr{display:flex;align-items:center;gap:10px}
.streak{font-weight:700;background:var(--y);color:var(--ink);border-radius:999px;padding:4px 10px;font-size:14px;white-space:nowrap}
.score{font-family:var(--mono);font-size:22px;white-space:nowrap}
.score small{font-family:var(--body);font-size:13px;font-weight:400;opacity:.8;margin-left:4px}
.card{background:var(--paper);color:var(--ink);border-radius:18px;padding:20px;display:grid;gap:16px}
.qtext{font-size:clamp(20px,3.2vw,27px);font-weight:700;line-height:1.25}
.qtext p{margin:0 0 .4em}.qtext p:last-child{margin:0}
.media{display:grid;gap:10px}
.media img,.media video{display:block;max-width:100%;max-height:46vh;margin:0 auto;border-radius:12px;background:#000}
.media video{width:100%;aspect-ratio:16/9;object-fit:contain}
.media iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px}
.media .missing{background:#ECE9E1;color:var(--soft);border-radius:12px;padding:18px;text-align:center;font-size:15px}
.watch{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:#ECE9E1;border-radius:12px;padding:12px 14px}
.watch p{margin:0;color:var(--soft);font-size:15px}
.watch .btn.ready{background:var(--rec)}
.tc{position:relative;height:50px;border-radius:10px;background:var(--ink);overflow:hidden;color:#fff;font-family:var(--mono)}
.tc .ticks{position:absolute;inset:0;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.14) 0 1px,transparent 1px calc(100% / var(--secs)))}
.tc .fill{position:absolute;inset:0 auto 0 0;width:0;background:#2C3442}
.tc .head{position:absolute;top:0;bottom:0;width:3px;left:0;background:var(--rec);box-shadow:0 0 10px var(--rec)}
.tc .read{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 14px;font-weight:700;font-variant-numeric:tabular-nums}
.tc .read .lbl{opacity:.6;font-size:12px;margin-right:6px}
.tc.late .fill{background:#5A1D1B}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.answers.grid1{grid-template-columns:1fr}
@media (max-width:600px){.answers{grid-template-columns:1fr}}
.ans{position:relative;display:flex;align-items:center;gap:12px;text-align:left;border:0;border-radius:14px;padding:16px 38px 16px 14px;min-height:76px;font-size:17.5px;font-weight:700;color:#fff;transition:transform .08s,opacity .2s}
.ans:active{transform:scale(.98)}
.ans p{margin:0}
.ans .sw{flex:none;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-family:var(--display);font-size:15px;background:rgba(255,255,255,.22)}
.ans[data-s="0"]{background:#0089A6}.ans[data-s="1"]{background:var(--m)}.ans[data-s="2"]{background:var(--y);color:var(--ink)}.ans[data-s="3"]{background:#1F8A3B}
.ans[data-s="2"] .sw{background:rgba(0,0,0,.12)}
.ans.sel{box-shadow:0 0 0 3px var(--ink) inset,0 0 0 7px #fff inset;transform:translateY(-2px)}
.ans.sel::after,.answers.locked .ans.right::after{content:"✓";position:absolute;right:12px;top:8px;font-size:19px}
.answers.locked .ans{cursor:default}
.answers.locked .ans.dim{opacity:.28}
.answers.locked .ans.right{opacity:1;box-shadow:0 0 0 4px var(--ok)}
.answers.locked .ans.wrong{opacity:1;box-shadow:0 0 0 4px var(--ink)}
.answers.locked .ans.wrong::after{content:"✗";position:absolute;right:12px;top:8px;font-size:19px}
.hint{grid-column:1/-1;margin:0;font-weight:700;color:var(--ink);background:#FFF1B8;border-radius:10px;padding:10px 12px;font-size:15px}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;background:#ECE9E1;border-radius:12px;padding:10px 12px}
@media (max-width:600px){.mrow{grid-template-columns:1fr}}
.mrow .ml{font-weight:700}
.mrow select{border:2px solid var(--line);border-radius:10px;padding:10px;color:var(--ink);background:#fff;width:100%}
.mrow.right{box-shadow:0 0 0 3px var(--ok) inset}.mrow.wrong{box-shadow:0 0 0 3px var(--rec) inset}
.mrow .sol{grid-column:1/-1;font-size:14px;color:var(--soft)}
.olist{list-style:none;margin:0;padding:0;display:grid;gap:8px;counter-reset:o}
.olist li{display:flex;align-items:center;gap:10px;background:#ECE9E1;border-radius:12px;padding:8px 10px;font-weight:700}
.olist li::before{counter-increment:o;content:counter(o);width:30px;height:30px;border-radius:8px;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none;font-family:var(--display);font-size:14px}
.olist li span{flex:1}
.olist li button{border:0;background:#fff;border-radius:8px;width:40px;height:36px;font-size:16px;color:var(--ink)}
.olist li button:disabled{opacity:.3}
.olist li.right{box-shadow:0 0 0 3px var(--ok) inset}.olist li.wrong{box-shadow:0 0 0 3px var(--rec) inset}
.olist.locked li button{display:none}
.sa{border:2px solid var(--line);border-radius:12px;padding:14px;font-size:19px;color:var(--ink);width:100%}
.sa:focus{border-color:var(--ink);outline:none}
.hotwrap{position:relative;display:inline-block;max-width:100%;margin:0 auto;cursor:crosshair;line-height:0}
.hotwrap img{max-width:100%;max-height:52vh;border-radius:12px;display:block}
.hotmark{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:4px solid var(--rec);background:rgba(232,50,43,.25);pointer-events:none}
.hotreg{position:absolute;border:4px dashed var(--ok);background:rgba(43,178,76,.18);pointer-events:none}
.hotreg.circle{border-radius:50%}
.solbox{background:#ECE9E1;border-radius:12px;padding:10px 12px;font-size:15px;color:var(--ink)}
.verdict{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;border-radius:14px;padding:14px 16px;color:#fff}
.verdict.ok{background:#1F8A3B}.verdict.ko{background:var(--ink)}
.verdict .vhost{display:flex;gap:12px;align-items:flex-end;flex:1;min-width:240px}
.verdict .vhost svg{width:58px;flex:none;background:#fff;border-radius:12px;padding:3px}
.verdict h3{margin:0;font-family:var(--display);font-size:22px}
.verdict p{margin:2px 0 0;font-size:15px;opacity:.95}
.verdict .quip{font-style:italic}
.verdict .fbk{flex-basis:100%;margin:0;font-size:15px;background:rgba(255,255,255,.12);border-radius:10px;padding:10px 12px;display:grid;gap:6px}
.verdict .btn{background:#fff;color:var(--ink)}
/* final */
.final{display:grid;gap:18px}
.final h2{font-family:var(--display);font-size:clamp(26px,5vw,40px);margin:0;line-height:1.05}
.bignum{font-family:var(--display);font-size:clamp(64px,16vw,140px);line-height:.9;letter-spacing:-.03em}
.bignum small{display:block;font-family:var(--body);font-size:18px;letter-spacing:0;margin-top:8px;opacity:.9}
.tier{font-family:var(--display);font-size:clamp(22px,4.4vw,32px);color:var(--rec);margin:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats div{background:#ECE9E1;border-radius:12px;padding:12px}
.stats b{display:block;font-family:var(--display);font-size:21px}
.stats span{font-size:14px;color:var(--soft)}
.ticket{font-family:var(--mono);background:var(--ink);color:#EDEFF2;border-radius:12px;padding:16px;white-space:pre-wrap;font-size:14.5px;line-height:1.6;overflow-x:auto}
.breakdown{display:grid;gap:6px;max-height:300px;overflow:auto;margin:10px 0 0;padding:0;list-style:none}
.breakdown li{display:flex;justify-content:space-between;gap:10px;font-size:14.5px;padding:8px 10px;border-radius:8px;background:#ECE9E1}
.breakdown li.ko{color:var(--soft)}
textarea{width:100%;min-height:150px;border:2px solid var(--line);border-radius:10px;padding:12px;font:15px/1.5 var(--mono);color:var(--ink)}
select{border:2px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--ink);background:#fff;width:100%}
.vres{font-weight:700;padding:12px 14px;border-radius:10px}
.vres.ok{background:#DCF3E2;color:#11622A}.vres.ko{background:#FBE0DE;color:#9A1A14}
/* rótulos y candado */
.overlay{position:fixed;inset:0;display:grid;place-items:center;background:rgba(18,22,28,.96);z-index:20;text-align:center;padding:20px}
.overlay .onair{display:inline-block;font-family:var(--mono);font-weight:700;letter-spacing:.12em;border:3px solid var(--rec);color:var(--rec);border-radius:8px;padding:4px 14px;margin-bottom:14px}
.overlay .big{font-family:var(--display);font-size:clamp(90px,26vw,220px);line-height:1;color:#fff}
.overlay .lbl{font-family:var(--display);font-size:clamp(20px,4vw,30px);margin-top:10px}
.overlay .pre{font-weight:700;opacity:.85;font-size:18px}
.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.lock{position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.7);display:grid;place-items:center;padding:20px}
.lock .panel{width:min(440px,100%)}
.lock h3{margin:0;font-family:var(--display);font-size:22px}
.spin{display:inline-block;width:16px;height:16px;border:3px solid var(--line);border-top-color:var(--rec);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
/* presentadora: la cámara */
.host .tally{animation:blink 1.4s steps(2,start) infinite}
.host .iris{transition:transform .25s;transform-origin:50px 58px}
.host.ok .iris{transform:scale(1.25)}
.host.ko .iris{transform:scale(.6)}
.host.ok{animation:nod .5s ease-in-out 2}
@keyframes nod{50%{transform:translateY(-4px)}}
/* botones fijos */
.fab{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:10px 16px;font-weight:700;font-size:15px;background:var(--paper);color:var(--ink);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.fab.snd{right:max(14px,env(safe-area-inset-right,0px))}
.fab.a11y{left:max(14px,env(safe-area-inset-left,0px))}
.fab b{font-family:var(--display)}
.a11ypanel{position:fixed;left:14px;bottom:70px;z-index:41;width:min(320px,calc(100vw - 28px));background:var(--paper);color:var(--ink);border-radius:16px;padding:16px;display:grid;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.a11ypanel h3{margin:0;font-size:17px}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:2px solid var(--line);background:#fff;border-radius:10px;padding:8px;font-weight:700;color:var(--ink)}
.seg button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
label.sw{display:flex;align-items:center;gap:10px;font-size:15px}
label.sw input{width:22px;height:22px}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:30;width:100%;height:100%}
html.a11y-l .wrap{zoom:1.15} html.a11y-xl .wrap{zoom:1.32}
html.a11y-rm *,html.a11y-rm *::before,html.a11y-rm *::after{animation:none!important;transition:none!important}
html.a11y-hc body{background:#000}
html.a11y-hc body::after{display:none}
html.a11y-hc .card,html.a11y-hc .panel,html.a11y-hc .bubble,html.a11y-hc .qcard,html.a11y-hc .howto li{box-shadow:0 0 0 3px #fff;background:#fff;color:#000}
html.a11y-hc .note,html.a11y-hc .qcard .d,html.a11y-hc .qcard .m,html.a11y-hc .rules li{color:#000}
html.a11y-hc .ans{border:3px solid #000}
html.a11y-hc .ans[data-s="0"]{background:#005468}html.a11y-hc .ans[data-s="1"]{background:#86005F}html.a11y-hc .ans[data-s="3"]{background:#0D5A23}

<body>
<div class="wrap">
  <div class="topbar">
    <span class="recbadge"><span class="dot" aria-hidden="true"></span><span id="tcClock">REC 00:00:00</span></span>
    <div class="lang" role="group" aria-label="Idioma / Language"><button type="button" data-lang="es">ES</button><button type="button" data-lang="en">EN</button></div>
  </div>

<!-- PORTADA -->
<section id="sHome">
  <div class="hero vf">
    <p class="course" id="courseTitle"></p>
    <h1 class="showname"><span class="bigdot" aria-hidden="true"></span>REC</h1>
    <div class="bars" aria-hidden="true"><i style="background:#fff"></i><i style="background:var(--y)"></i><i style="background:var(--c)"></i><i style="background:var(--g)"></i><i style="background:var(--m)"></i><i style="background:var(--rec)"></i><i style="background:var(--b)"></i></div>
    <div class="hostline"><span class="hostslot" data-size="86"></span><div class="bubble" id="homeBubble"></div></div>
  </div>
  <h2 class="sectitle" data-t="howTitle"></h2>
  <ol class="howto" id="howto"></ol>
  <div id="homeBlocks"><p data-t="loading"></p></div>
  <div class="homefoot"><button class="linkish" id="btnVerifyOpen" data-t="verifyLink"></button><span id="courseFoot"></span><a href="https://github.com/lorenagmad/REC" target="_blank" rel="noopener" style="color:#fff" data-t="madeWith"></a></div>
</section>

<!-- ENTRADA AL CONCURSO -->
<section id="sIntro" class="hidden">
  <button class="backbtn" data-home data-t="backHome"></button>
  <div class="hero vf" style="padding:22px">
    <span class="pill"><span class="dot" aria-hidden="true"></span><span id="quizTitle"></span></span>
    <div class="hostline"><span class="hostslot" data-size="86"></span><div class="bubble" id="introBubble"></div></div>
  </div>
  <div class="panel" style="margin-top:18px">
    <p class="note hidden" id="pracNote"><span class="practag" data-t="practice"></span> <span data-t="pracNote"></span></p>
    <div class="fields" id="idFields">
      <label><span data-t="name"></span><input type="text" id="inName" autocomplete="name"></label>
      <label><span data-t="sid"></span><input type="text" id="inDni" autocomplete="off" spellcheck="false"></label>
    </div>
    <ul class="rules" id="rules"></ul>
    <details class="extra" id="extraBox"><summary data-t="extraQ"></summary>
      <label style="margin-top:8px"><span data-t="extraCode"></span><input type="text" id="inExtra" autocomplete="off" spellcheck="false" placeholder="TE50-AB12C"></label>
      <p class="note" style="margin-top:6px" data-t="extraNote"></p>
    </details>
    <p class="note" id="videoNote" hidden data-t="videoNote"></p>
    <p class="err" id="introErr" role="alert"></p>
    <button class="btn big" id="btnStart"></button>
  </div>
</section>

<!-- PREGUNTA -->
<section id="sQ" class="hidden">
  <div class="hud">
    <div class="prog" id="prog" aria-hidden="true"></div>
    <div class="hudr"><span class="streak hidden" id="streak"></span><div class="score" id="hudScore"></div></div>
  </div>
  <div class="card">
    <div class="qtext" id="qText"></div>
    <div class="media" id="qMedia"></div>
    <div class="watch hidden" id="qWatch"><p data-t="watch"></p><button class="btn" id="btnReady" data-t="answerBtn"></button></div>
    <div class="tc hidden" id="tl" aria-hidden="true"><div class="fill" id="tlFill"></div><div class="ticks"></div><div class="head" id="tlHead"></div>
      <div class="read"><span><span class="lbl">TC</span><span id="tlSecs"></span></span><span id="tlPts"></span></div></div>
    <div class="answers hidden" id="qAns"></div>
    <button class="btn hidden" id="btnConfirm"></button>
    <div class="verdict hidden" id="verdict" role="status"></div>
  </div>
</section>

<!-- FINAL -->
<section id="sFinal" class="final hidden">
  <h2 id="fHello"></h2>
  <div class="bignum" id="fScore"></div>
  <div class="hostline"><span class="hostslot" data-size="86"></span><div class="bubble"><p class="tier" id="fTier"></p><span id="fTierText"></span></div></div>
  <div class="panel">
    <div class="stats">
      <div><b id="fHits"></b><span data-t="statHits"></span></div>
      <div><b id="fAvg"></b><span data-t="statAvg"></span></div>
      <div><b id="fMax"></b><span data-t="statMax"></span></div>
    </div>
    <div><p class="note" style="margin-bottom:8px"><b style="color:var(--ink)" data-t="sendTicket"></b> <span data-t="sendTicket2"></span></p><div class="ticket" id="fTicket"></div></div>
    <div class="row"><button class="btn hidden" id="btnFile" style="background:var(--rec)" data-t="dlFile"></button><button class="btn" id="btnCopy" data-t="copy"></button><span class="note" id="copyMsg" role="status"></span></div>
    <p class="note hidden" id="fileNote"><b style="color:var(--ink)" data-t="fileNote1"></b> <span data-t="fileNote2"></span></p>
    <button class="btn ghost" style="justify-self:start" data-home data-t="backHome2"></button>
    <details><summary style="cursor:pointer;font-weight:700" data-t="byQuestion"></summary><ul class="breakdown" id="fBreak"></ul></details>
  </div>
</section>

<!-- FIN DE LA PRÁCTICA -->
<section id="sPEnd" class="final hidden">
  <h2 id="pHello"></h2>
  <div class="bignum" id="pScore"></div>
  <div class="panel">
    <div id="pList" style="display:grid;gap:8px"></div>
    <div class="hidden" id="pLogBox" style="display:grid;gap:8px"><p class="note" id="pLogNote"></p>
      <div class="row"><button class="btn" id="btnPLog" style="background:var(--rec)" data-t="pracLogDl"></button><span class="note" id="pLogMsg" role="status"></span></div></div>
    <div class="row"><button class="btn" id="btnPAgain" data-t="pracAgain"></button><button class="btn ghost" data-home data-t="backHome2"></button></div>
  </div>
</section>

<!-- VERIFICADOR -->
<section id="sVerify" class="final hidden">
  <h2 data-t="verifyTitle"></h2>
  <div class="panel">
    <p class="note" data-t="verifyNote"></p>
    <div class="fields"><label><span data-t="contest"></span><select id="vQuiz"></select></label><label><span data-t="password"></span><input type="text" id="vPass" autocomplete="off" autocapitalize="off" spellcheck="false"></label></div>
    <textarea id="vIn" aria-label="Tickets"></textarea>
    <div class="row"><button class="btn" id="btnVerify" data-t="check"></button><button class="btn ghost" id="btnVerifyBack" data-t="back"></button></div>
    <div id="vOut" style="display:grid;gap:8px"></div>
  </div>
</section>
</div>

<div class="lock hidden" id="lock" role="dialog" aria-modal="true" aria-labelledby="lockTitle">
  <div class="panel">
    <h3 id="lockTitle"></h3>
    <p class="note" id="lockSub"></p>
    <label><span data-t="password"></span><input type="text" id="lockPass" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    <p class="err" id="lockErr" role="alert"></p>
    <div class="row"><button class="btn" id="lockGo"></button><button class="btn ghost" id="lockCancel" data-t="cancel"></button></div>
  </div>
</div>
<button class="fab snd" id="sndBtn" type="button"></button>
<button class="fab a11y" id="a11yBtn" type="button" aria-expanded="false" aria-controls="a11yPanel"><b>Aa</b><span data-t="a11y"></span></button>
<div class="a11ypanel hidden" id="a11yPanel" role="dialog">
  <h3 data-t="a11y"></h3>
  <div><div style="font-weight:700;font-size:14px;margin-bottom:6px" data-t="textSize"></div>
    <div class="seg" id="a11ySize"><button type="button" data-v="" data-t="sizeN"></button><button type="button" data-v="l" data-t="sizeL"></button><button type="button" data-v="xl" data-t="sizeXL"></button></div></div>
  <label class="sw"><input type="checkbox" id="a11yHc"> <span data-t="contrast"></span></label>
  <label class="sw"><input type="checkbox" id="a11yRm"> <span data-t="motion"></span></label>
  <button class="btn" id="a11yClose" type="button" data-t="close"></button>
</div>
<div class="overlay hidden" id="ov" aria-live="assertive"></div>
<canvas id="fx"></canvas>

/* ---- xAPI (Experience API 1.0.3): una declaración por interacción ---- */
function buildXapi(o){
  // o: {base, lang, platform, quiz:{id,title}, actor:{name,id}, log, start, end, total, max, maxQ, extra, record}
  const hid = s => 'r' + cyrb53(String(s)).toString(36).slice(0,9);
  const L = t => ({[o.lang]: String(t)});
  const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{ const r=Math.random()*16|0; return (c==='x'?r:(r&3|8)).toString(16); }));
  const dur = s => 'PT' + (Math.round((s||0)*10)/10) + 'S';
  const actor = {objectType:'Agent', name:o.actor.name, account:{homePage:o.base, name:o.actor.id}};
  const contest = {objectType:'Activity', id:`${o.base}contests/${encodeURIComponent(o.quiz.id)}`, definition:{type:'http://adlnet.gov/expapi/activities/assessment', name:L(o.quiz.title)}};
  const ctx = (extra) => ({platform:o.platform, language:o.lang, contextActivities:{parent:[{objectType:'Activity', id:contest.id}]},
    extensions:{[`${o.base}xapi/extra-time`]: o.extra||0, ...(extra||{})}});
  const verb = (v, es, en) => ({id:`http://adlnet.gov/expapi/verbs/${v}`, display:{'es-ES':es, 'en-US':en}});
  const st = [{id:uuid(), actor, verb:verb('attempted','intentó','attempted'), object:contest, context:{platform:o.platform, language:o.lang, extensions:{[`${o.base}xapi/extra-time`]: o.extra||0}}, timestamp:o.start}];
  o.log.forEach((l,i)=>{
    const def = {type:'http://adlnet.gov/expapi/activities/cmi.interaction', name:L(l.name), description:L(l.q||l.name)};
    let resp = '';
    const sel = l.sel||[], good = l.good||[];
    if(l.tipo==='mc' || l.tipo==='mm'){ def.interactionType='choice'; def.choices=(l.opciones||[]).map(x=>({id:hid(x), description:L(x)}));
      def.correctResponsesPattern=[good.map(hid).join('[,]')]; resp = sel.map(hid).join('[,]'); }
    else if(l.tipo==='tf'){ const tv = x => /^(verdadero|true)/i.test(String(x).trim()) ? 'true' : 'false'; def.interactionType='true-false'; def.correctResponsesPattern=[good[0]?tv(good[0]):'true']; resp = sel[0]?tv(sel[0]):''; }
    else if(l.tipo==='match'){ const sp = x => String(x).split(' → '); const src=[...new Set(good.map(g=>sp(g)[0]))], tgt=[...new Set([...good, ...sel].map(g=>sp(g)[1]).filter(Boolean))];
      def.interactionType='matching'; def.source=src.map(x=>({id:hid(x), description:L(x)})); def.target=tgt.map(x=>({id:hid(x), description:L(x)}));
      def.correctResponsesPattern=[good.map(g=>hid(sp(g)[0])+'[.]'+hid(sp(g)[1])).join('[,]')]; resp = sel.map(g=>hid(sp(g)[0])+'[.]'+hid(sp(g)[1]||'')).join('[,]'); }
    else if(l.tipo==='order'){ const items=(good[0]||'').split(' → '); def.interactionType='sequencing'; def.choices=items.map(x=>({id:hid(x), description:L(x)}));
      def.correctResponsesPattern=[items.map(hid).join('[,]')]; resp = sel[0] ? sel[0].split(' → ').map(hid).join('[,]') : ''; }
    else if(l.tipo==='short'){ def.interactionType='fill-in'; def.correctResponsesPattern=good.slice(); resp = sel[0]||''; }
    else { def.interactionType='other'; resp = sel[0]||''; }
    const res = {success: !!l.ok, response: resp, score:{raw:l.pts||0, min:0, max:o.maxQ, scaled:+((l.pts||0)/o.maxQ).toFixed(4)},
      extensions:{[`${o.base}xapi/result`]: l.res, [`${o.base}xapi/time-limit`]: l.limite??null}};
    if(l.t!=null) res.duration = dur(l.t);
    st.push({id:uuid(), actor, verb:verb('answered','respondió','answered'), object:{objectType:'Activity', id:`${contest.id}/questions/${encodeURIComponent(l.name)}`, definition:def},
      result:res, context:ctx({[`${o.base}xapi/topic`]: l.tema||'', [`${o.base}xapi/position`]: i+1}), timestamp:l.at||o.end});
  });
  const secs = Math.max(0,(Date.parse(o.end)-Date.parse(o.start))/1000);
  st.push({id:uuid(), actor, verb:verb('completed','completó','completed'), object:contest,
    result:{completion:true, duration:dur(secs), score:{raw:o.total, min:0, max:o.max, scaled:+(o.total/o.max).toFixed(4)}, extensions:{[`${o.base}xapi/record`]: o.record}},
    context:ctx(), timestamp:o.end});
  return st;
}
/* lee un archivo de resguardo: formato propio o xAPI (lista de declaraciones con el registro en «completed») */
function recordFromFile(o){
  if(!Array.isArray(o)) return {record:o, statements:null};
  for(const s of o){ const ex = s && s.result && s.result.extensions; if(!ex) continue;
    const k = Object.keys(ex).find(k=>/\/xapi\/record$/.test(k)); if(k) return {record:ex[k], statements:o}; }
  return {record:null, statements:o};
}
/* anonimiza una lista de declaraciones (para exportar a un LRS o a un estudio) */
function anonStatements(list, anonOf){
  return list.map(s=>{ const c = structuredClone(s); const id = c.actor && c.actor.account ? c.actor.account.name : '';
    const a = anonOf(id); c.actor = {objectType:'Agent', account:{homePage:c.actor.account.homePage, name:a}};
    const ex = c.result && c.result.extensions; if(ex){ const k = Object.keys(ex).find(k=>/\/xapi\/record$/.test(k)); if(k) delete ex[k]; }
    return c; });
}

  const withFile = !!r.analysis && !!r.log && r.log.length && r.log[0].res !== undefined;
  $('btnFile').classList.toggle('hidden', !withFile); $('fileNote').classList.toggle('hidden', !withFile); $('copyMsg').textContent='';
  $('btnFile').onclick = () => {
    const detail = r.log.map((l,i)=>({n:i+1, id:l.name, topic:l.tema||'', type:l.tipo||'', question:l.q, result:l.res, chosen:l.sel, answer:l.good, options:l.opciones||[], seconds:l.t, limit:l.limite??null, points:l.pts}));
    const check = cyrb53(`${QUIZ.salt}|${QUIZ.id}|${r.id}|${JSON.stringify(detail)}`).toString(36).toUpperCase();
    const file = {format:'rec-result-1', contest:QUIZ.title, contest_id:QUIZ.id, name:r.name, student_id:r.id, anon_id:anonId(r.id), points:r.score, correct:r.hits, questions:r.n, max, extra_time:r.extra||0,
                  date:r.date, code:r.code, ticket:ticketText(r), detail, check};
    const statements = buildXapi({base: location.origin + location.pathname.replace(/[^/]*$/,''), lang: LANG==='es'?'es-ES':'en-GB', platform:'REC', quiz:{id:QUIZ.id, title:QUIZ.title},
      actor:{name:r.name, id:r.id}, log:r.log, start:r.start||new Date().toISOString(), end:r.end||new Date().toISOString(), total:r.score, max, maxQ:Math.round(max/r.n), extra:r.extra||0, record:file});
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(statements,null,1)],{type:'application/json'}));
    a.download=`rec-${QUIZ.id}-${r.id}.xapi.json`; document.body.appendChild(a); a.click(); a.remove(); $('copyMsg').textContent=T.fileDone; };
  $('btnCopy').onclick = async () => { try{ await navigator.clipboard.writeText(ticketText(r)); $('copyMsg').textContent=T.copied; }
    catch(e){ const sel=window.getSelection(), rg=document.createRange(); rg.selectNodeContents($('fTicket')); sel.removeAllRanges(); sel.addRange(rg); $('copyMsg').textContent=T.selected; } };
  window.scrollTo({top:0});
}

/* ============ portada, contraseñas, descifrado y verificador ============ */
const KDF_ITER = 300000;
const normPass = s => (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/\s+/g,' ');
async function openQuiz(m, pass){
  const T = L();
  if(!window.crypto || !crypto.subtle) throw new Error(T.errCrypto);
  if(!normPass(pass)) throw new Error(T.errPass);
  let buf; try{ const r = await fetch(`contests/${m.file}`, {cache:'no-cache'}); if(!r.ok) throw 0; buf = await r.arrayBuffer(); } catch(e){ throw new Error(T.errNet); }
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(normPass(pass)), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:buf.slice(0,16), iterations:KDF_ITER, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  let plain; try{ plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:buf.slice(16,28)}, key, buf.slice(28)); } catch(e){ throw new Error(T.errWrong); }
  return JSON.parse(new TextDecoder().decode(plain));
}
function doneBefore(qid){ try{ for(let i=0;i<localStorage.length;i++){ if(localStorage.key(i).startsWith(`rec:${qid}:`)) return true; } }catch(e){} return false; }
const SHOWALL = new URLSearchParams(location.search).has('all') || new URLSearchParams(location.search).has('todos');
function renderHome(){
  const T = L(), list = MANIFEST.contests.filter(q=>(SHOWALL || q.active!==false) && (!q.lang || q.lang===LANG));  /* un concurso con idioma solo aparece en ese idioma */
  const C = MANIFEST.course, ctitle = C['title_'+LANG] || C.title || '', csub = C['subtitle_'+LANG] || C.subtitle || '';
  $('courseTitle').textContent = ctitle; $('courseFoot').textContent = csub || ctitle;
  document.title = 'REC' + (ctitle ? ' | ' + ctitle : '');
  const secs = [...new Set(list.map(q=>q.section||''))];
  $('homeBlocks').innerHTML = secs.map(s=>`<div class="block">${s?`<h3><span>${escH(s)}</span></h3>`:''}<div class="qgrid">${
    list.filter(q=>(q.section||'')===s).map(q=>{ const recs = pracRecords(q.id); return `<div class="qitem"><button class="qcard${q.global?' global':''}" data-q="${escH(q.file)}"${q.practice_only?' data-only="1"':''}>
      <span class="t">${escH(q.name||q.title)}${q.active===false?`<span class="tagoff">${T.hidden}</span>`:q.practice_only?`<span class="tagdone" style="background:var(--y);color:var(--ink)">${T.pracOnly}</span>`:doneBefore(q.id)?`<span class="tagdone">${T.done}</span>`:''}</span>
      ${q.description?`<span class="d">${escH(q.description)}</span>`:''}<span class="m">${q.questions} ${T.questions}${q.video?T.withVideo:''}</span></button>
      ${q.practice && !q.practice_only?`<button class="qprac" data-p="${escH(q.file)}">${T.practiceBtn}</button>`:''}
      ${recs.map(r=>`<button class="qprac" data-log="${escH(q.id)}" data-sid="${escH(r.id)}">${T.pracLogCard(r.attempts.length)}${recs.length>1?` · ${escH(r.name.split(' ')[0])}`:''}</button>`).join('')}</div>`; }).join('')}</div></div>`).join('') || `<p>${T.noContests}</p>`;
  /* un concurso «solo práctica» no ofrece el modo evaluable aunque se tenga la contraseña */
  $('homeBlocks').querySelectorAll('.qcard').forEach(b=> b.onclick = () => openLock(MANIFEST.contests.find(q=>q.file===b.dataset.q), !!b.dataset.only));
  $('homeBlocks').querySelectorAll('[data-log]').forEach(b=> b.onclick = () => pracDownload(b.dataset.log, b.dataset.sid));
  $('homeBlocks').querySelectorAll('.qprac[data-p]').forEach(b=> b.onclick = () => openLock(MANIFEST.contests.find(q=>q.file===b.dataset.p), true));
}
function openLock(m, prac){
  const T=L(); LOCKED = m; LOCKPRAC = !!prac || !!m.practice_only;
  $('lockTitle').textContent = (prac?T.pracTitle:'') + (m.section?`${m.section}: `:'') + (m.name||m.title); $('lockSub').textContent = m.description||'';
  $('lockGo').textContent = prac ? T.startPrac : T.enter;
  $('lockPass').value=''; $('lockErr').textContent=''; $('lock').classList.remove('hidden'); $('lockPass').focus();
}
$('lockCancel').onclick = () => $('lock').classList.add('hidden');
$('lockPass').onkeydown = e => { if(e.key==='Enter') $('lockGo').click(); };
$('lockGo').onclick = async () => {
  const btn = $('lockGo'); btn.disabled = true; $('lockErr').innerHTML = `<span class="spin"></span>${L().opening}`; $('lockErr').style.color='var(--soft)';
  try{ const pack = await openQuiz(LOCKED, $('lockPass').value); $('lock').classList.add('hidden'); setupQuiz(pack, LOCKPRAC); }
  catch(e){ $('lockErr').style.color=''; $('lockErr').textContent = e.message; }
  finally{ btn.disabled = false; }
};
function goHome(){ const v=$('qMedia').querySelector('video'); if(v) v.pause(); S=null; QUIZ=null; renderHome(); show('sHome'); window.scrollTo({top:0}); }
document.querySelectorAll('[data-home]').forEach(b=> b.onclick = goHome);

/* verificador: admite resguardos en español y en inglés */
$('btnVerifyOpen').onclick = () => { $('vQuiz').innerHTML = MANIFEST.contests.map(q=>`<option value="${escH(q.file)}">${escH(q.title)}</option>`).join(''); $('vOut').innerHTML=''; show('sVerify'); window.scrollTo({top:0}); };
$('btnVerifyBack').onclick = () => goHome();
function parseTicket(b){
  const g = re => ((b.match(re)||[])[1]||'').trim();
  return { title:g(/^REC\s*\|\s*(.+)/m), name:g(/(?:Nombre|Name):\s*(.+)/), id:normId(g(/(?:ID|DNI):\s*(.+)/)), pts:g(/(?:Puntos|Points):\s*(\d+)/), hits:g(/(?:Aciertos|Correct):\s*(\d+)/),
           max:+(g(/(?:M[aá]ximo posible|Maximum):\s*(\d+)/)||0), code:g(/(?:C[oó]digo|Code):\s*([A-Z0-9-]+)/i).toUpperCase() };
}
$('btnVerify').onclick = async () => {
  const T = L(), out = $('vOut'); out.innerHTML = `<div class="note"><span class="spin"></span>${T.vOpening}</div>`;
  const m = MANIFEST.contests.find(q=>q.file===$('vQuiz').value);
  let Q; try{ Q = (await openQuiz(m, $('vPass').value)).quiz; } catch(e){ out.innerHTML = `<div class="vres ko">${escH(e.message)}</div>`; return; }
  const blocks = $('vIn').value.split(/(?=REC\s*\|)/).map(s=>s.trim()).filter(s=>/^REC\s*\|/.test(s));
  out.innerHTML = ''; if(!blocks.length){ out.innerHTML = `<div class="vres ko">${T.vNone}</div>`; return; }
  blocks.forEach(b=>{ const t = parseTicket(b), d = document.createElement('div');
    if(!t.id||!t.pts||!t.hits||!t.code){ d.className='vres ko'; d.textContent=T.vIncomplete; }
    else { const same = t.title===Q.title, ok = same && makeCode(t.id,+t.pts,+t.hits,Q,t.max)===t.code;
      d.className='vres '+(ok?'ok':'ko'); d.textContent = `${ok?T.vValid:T.vInvalid}: ${t.name||'—'}, ${t.id}, ${t.pts} ${T.points}, ${t.hits}` + (ok?'':(same?T.vMismatch:T.vOther)); }
    out.appendChild(d); });
};

/* arranque */
fillHosts(); applyLang(); show('sHome');
fetch('contests/index.json',{cache:'no-cache'}).then(r=>r.json()).then(m=>{
  MANIFEST = {course:m.course||{}, contests:m.contests||[]};
  if(!store.get('rec:lang') && MANIFEST.course.language) LANG = MANIFEST.course.language;
  applyLang();
}).catch(()=>{ $('homeBlocks').innerHTML = `<p>${L().errList}</p>`; });
</script>
