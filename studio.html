<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REC Estudio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='40' fill='%23E8322B'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--stage:#12161C;--paper:#F6F4EF;--card:#fff;--ink:#15171C;--soft:#5D6470;--line:#D9D6CE;--rec:#E8322B;--y:#F2C200;--c:#00A6C8;--g:#2BB24C;--m:#C2188F;--b:#2747C9;
  --display:"Archivo Black","Arial Black",system-ui,sans-serif;--body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;font-family:var(--body);background:var(--paper);color:var(--ink);font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.hidden{display:none!important}
header{background:var(--stage);color:#fff;position:sticky;top:0;z-index:20}
.hbar{max-width:1180px;margin:0 auto;padding:12px 18px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:24px}
.brand .dot{width:18px;height:18px;border-radius:50%;background:var(--rec);box-shadow:0 0 12px var(--rec)}
.brand small{font-family:var(--body);font-size:14px;font-weight:700;opacity:.75}
.hact{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hbtn{border:0;border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;background:rgba(255,255,255,.1);color:#fff}
.hbtn:hover{background:rgba(255,255,255,.2)}
.lang{display:flex;background:rgba(255,255,255,.1);border-radius:999px;padding:3px}
.lang button{border:0;background:none;color:#fff;font-weight:700;border-radius:999px;padding:4px 11px;font-size:13px}
.lang button[aria-pressed="true"]{background:#fff;color:var(--ink)}
.saved{font-family:var(--mono);font-size:12px;opacity:.7}
nav.tabs{max-width:1180px;margin:0 auto;padding:0 18px;display:flex;gap:4px;overflow-x:auto}
nav.tabs button{border:0;background:none;color:#fff;opacity:.7;padding:10px 14px;font-weight:700;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected="true"]{opacity:1;border-color:var(--rec)}
nav.tabs .n{font-family:var(--mono);margin-right:6px;opacity:.7}
main{max-width:1180px;margin:0 auto;padding:22px 18px 80px}
h1{font-family:var(--display);font-size:28px;margin:0 0 6px}
h2{font-size:19px;margin:0}
.lead{margin:0 0 18px;color:var(--soft);max-width:820px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:12px;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.grid6{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
@media (max-width:800px){.grid2,.grid3{grid-template-columns:1fr}.grid6{grid-template-columns:repeat(2,1fr)}}
label{display:grid;gap:5px;font-weight:700;font-size:14px}
label .hintx{font-weight:400;color:var(--soft);font-size:13px}
input[type=text],input[type=number],input[type=password],select,textarea{border:2px solid var(--line);border-radius:10px;padding:9px 11px;color:var(--ink);background:#fff;width:100%}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--ink);outline:none}
.check{display:flex;gap:8px;align-items:center;font-weight:700;font-size:14.5px}
.check input{width:19px;height:19px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;background:var(--ink);color:#fff}
.btn:hover{background:#000}
.btn.rec{background:var(--rec)}.btn.rec:hover{background:#c9241e}
.btn.alt{background:#ECE9E1;color:var(--ink)}.btn.alt:hover{background:#E0DCD1}
.btn.sm{padding:6px 10px;font-size:13.5px;border-radius:8px}
.btn.danger{background:#fff;color:#A3161B;border:2px solid #F0C4C1}
.btn:disabled{opacity:.45;cursor:not-allowed}
.note{margin:0;color:var(--soft);font-size:14px}
.msg{border-radius:10px;padding:10px 12px;font-size:14.5px;margin:0}
.msg.ok{background:#DCF3E2;color:#11622A}.msg.ko{background:#FBE0DE;color:#9A1A14}.msg.warn{background:#FFF1B8;color:#5A4A00}.msg.info{background:#E6F4F8;color:#0E5262}
.msgs{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap;background:#ECE9E1;color:var(--ink)}
.badge.t-mc,.badge.t-mm{background:#E3F4F8;color:#0E5262}.badge.t-tf{background:#F6E1EF;color:#7E0F5C}.badge.t-match{background:#E2F4E6;color:#17602B}
.badge.t-order{background:#FFF1B8;color:#5A4A00}.badge.t-short{background:#E5E9FA;color:#1E3399}.badge.t-hot{background:#FBE0DE;color:#9A1A14}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.toolbar label{min-width:160px}
.qtable{width:100%;border-collapse:collapse;font-size:14.5px}
.qtable th{background:var(--stage);color:#fff;text-align:left;padding:8px 10px;font-size:12.5px;text-transform:uppercase;letter-spacing:.03em;position:sticky;top:0}
.qtable td{padding:8px 10px;border-bottom:1px solid #ECE9E1;vertical-align:top}
.qtable tr:hover td{background:#FAF9F5}
.qtable .txt{color:var(--soft);font-size:13.5px;max-width:460px}
.tblwrap{overflow:auto;max-height:65vh;border:1px solid var(--line);border-radius:12px;background:#fff}
.ic{font-size:13px;color:var(--soft)}
/* editor modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,12,16,.6);display:grid;place-items:start center;padding:24px 12px;overflow:auto}
.modal .sheet{background:var(--paper);border-radius:16px;width:min(900px,100%);padding:20px;display:grid;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.modal .shead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.alist{display:grid;gap:8px}
.arow{display:grid;grid-template-columns:auto 1fr 1fr auto auto;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px}
.arow.pair{grid-template-columns:1fr 1fr auto}
.arow.acc{grid-template-columns:1fr 90px 1fr auto}
@media (max-width:700px){.arow,.arow.pair,.arow.acc{grid-template-columns:1fr}}
.mediabox{display:flex;gap:10px;flex-wrap:wrap}
.mitem{position:relative;border:1px solid var(--line);border-radius:10px;padding:6px;background:#fff;display:grid;gap:4px;font-size:12.5px;max-width:220px}
.mitem img{max-width:200px;max-height:120px;border-radius:6px;display:block}
.hoted{position:relative;display:inline-block;line-height:0;cursor:crosshair;user-select:none;max-width:100%}
.hoted img{max-width:100%;max-height:420px;border-radius:10px}
.hoted .rg{position:absolute;border:3px solid var(--g);background:rgba(43,178,76,.2)}
.hoted .rg.circle{border-radius:50%}
.hoted .rg span{position:absolute;top:2px;left:4px;font:700 12px var(--mono);color:#fff;background:var(--g);border-radius:4px;padding:0 4px;line-height:1.5}
/* concursos */
.ccards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.ccard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:6px;position:relative;overflow:hidden}
.ccard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.ccard.off{opacity:.6}
.ccard .t{font-weight:700;font-size:16px}
.ccard .s{font-size:13px;color:var(--soft)}
.pickl{display:grid;gap:4px;max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff}
.pickl label{display:flex;gap:8px;align-items:flex-start;font-weight:400;font-size:14px}
.pickl label input{margin-top:3px}
.sel{display:grid;gap:4px;counter-reset:s}
.sel div{display:flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:14px}
.sel div::before{counter-increment:s;content:counter(s);font:700 12px var(--mono);color:var(--soft);min-width:22px}
.sel div span{flex:1}
/* resultados (también se usa en el ranking descargable) */
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.subtabs button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-weight:700}
.subtabs button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:#ECE9E1;border-radius:12px;padding:12px 14px}
.kpi b{display:block;font-family:var(--display);font-size:22px;line-height:1.1}
.kpi span{font-size:13px;color:var(--soft)}
.ideas{margin:0;padding-left:20px;display:grid;gap:6px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13.5px;color:var(--soft)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.qa{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:8px;background:#fff}
.qa .top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.qa .tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.bar{display:flex;height:14px;border-radius:6px;overflow:hidden;background:#ECE9E1}
.bar span{display:block;height:100%}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13.5px;color:var(--soft)}
.meta b{color:var(--ink)}
.prof{display:flex;height:12px;border-radius:4px;overflow:hidden;min-width:120px;background:#ECE9E1}
.prof span{display:block;height:100%}
.scatter{width:100%;height:auto;background:#FBFAF7;border-radius:12px;border:1px solid var(--line)}
.tema{display:grid;grid-template-columns:minmax(150px,240px) 1fr 70px;gap:10px;align-items:center;font-size:14.5px}
.tema .tb{height:16px;border-radius:6px;background:#ECE9E1;overflow:hidden}
.tema .tb span{display:block;height:100%}
.up{color:#11622A;font-weight:800}.down{color:#9A1A14;font-weight:800}
.dtable{width:100%;border-collapse:collapse;font-size:14.5px;min-width:620px}
.dtable th{background:var(--stage);color:#fff;text-align:left;padding:8px 10px;font-size:12.5px;text-transform:uppercase}
.dtable td{padding:8px 10px;border-bottom:1px solid #ECE9E1;vertical-align:top}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.drop{border:3px dashed var(--line);border-radius:14px;padding:18px;text-align:center;color:var(--soft);font-weight:700;background:#fff}
.drop.over{border-color:var(--g);background:#EEF8F1}
.rv{position:fixed;inset:0;z-index:60;background:var(--stage);color:#fff;display:grid;grid-template-rows:auto 1fr auto;padding:24px clamp(16px,4vw,60px)}
.rv .slide{display:grid;align-content:center;gap:20px;max-width:1100px;margin:0 auto;width:100%}
.rv .qt{font-family:var(--display);font-size:clamp(24px,3.4vw,42px);line-height:1.15}
.rv .qimg{max-height:34vh;max-width:100%;border-radius:12px;justify-self:center}
.rv .opt{background:rgba(255,255,255,.08);border-radius:14px;padding:12px 16px;display:grid;gap:8px;font-size:clamp(17px,2vw,24px);font-weight:700}
.rv .opt.good{background:#fff;color:var(--ink);box-shadow:0 0 0 5px var(--g)}
.rv .ob{height:12px;border-radius:6px;background:rgba(255,255,255,.2);overflow:hidden}.rv .opt.good .ob{background:#ECE9E1}
.rv .ob span{display:block;height:100%;background:var(--y)}.rv .opt.good .ob span{background:var(--g)}
.rv .ol{display:flex;justify-content:space-between;gap:12px}
.rv .foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.rv .btn{background:#fff;color:var(--ink)}
code{background:#ECE9E1;border-radius:5px;padding:1px 6px;font-family:var(--mono);font-size:.92em}
</style>
<style id="rkcss">
.rk{font-family:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;color:#15171C;display:grid;gap:18px}
.rk-head{background:#12161C;color:#fff;border-radius:18px;padding:22px;text-align:center;position:relative}
.rk-head .pre{margin:0;font-size:15px;opacity:.85}
.rk-head h2{margin:6px 0;font-family:"Archivo Black","Arial Black",system-ui,sans-serif;font-size:clamp(28px,6vw,44px);line-height:1.05}
.rk-head h2::before{content:"";display:inline-block;width:.55em;height:.55em;border-radius:50%;background:#E8322B;margin-right:.3em;vertical-align:.05em;box-shadow:0 0 16px #E8322B}
.rk-head .sub{margin:0;font-size:15px}
.rk-bars{display:flex;height:8px;border-radius:4px;overflow:hidden;max-width:320px;margin:12px auto 0}.rk-bars i{flex:1}
.rk-pod{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:10px;align-items:end}
.rk-step{border-radius:14px 14px 6px 6px;padding:14px 10px;text-align:center;color:#15171C}
.rk-step .pl{font-weight:800;font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.rk-step .nm{font-weight:800;font-size:16px;margin:6px 0 2px;overflow-wrap:anywhere}
.rk-step .pt{font-family:"Archivo Black","Arial Black",system-ui,sans-serif;font-size:22px}
.rk-step .bn{font-size:13px;font-weight:700;margin-top:4px}
.rk-step.g1{background:#F2C200;min-height:210px}.rk-step.g2{background:#DCE1E8;min-height:170px}.rk-step.g3{background:#E8A66B;min-height:145px}
@media (max-width:560px){.rk-pod{grid-template-columns:1fr}.rk-step{min-height:0!important}.rk-step.g1{order:-1}}
.rk-tblwrap{overflow-x:auto;background:#fff;border-radius:16px}
.rk-tbl{width:100%;border-collapse:collapse;font-size:15px;min-width:560px}
.rk-tbl th{background:#12161C;color:#fff;text-align:left;padding:10px 12px;font-size:13px;text-transform:uppercase;letter-spacing:.03em}
.rk-tbl td{padding:9px 12px;border-bottom:1px solid #ECE9E1}
.rk-tbl tr:nth-child(even) td{background:#FAF9F5}
.rk-tbl .pos{font-weight:800;font-size:17px;width:48px}
.rk-tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.rk-bonus{display:inline-flex;align-items:center;gap:3px;white-space:nowrap;font-weight:800}
.rk-bonus i{display:inline-block;width:11px;height:11px;border-radius:50%;background:#E8322B}
.rk-bonus .none{color:#5D6470;font-weight:600}
.rk-legend{background:#fff;border-radius:16px;padding:14px 16px;font-size:14px;color:#5D6470}
.rk-legend b{color:#15171C}
</style>
</head>
<body>
<header>
  <div class="hbar">
    <div class="brand"><span class="dot" aria-hidden="true"></span>REC <small data-t="studio"></small></div>
    <div class="hact">
      <span class="saved" id="saved"></span>
      <a class="hbtn" id="helpLink" href="https://github.com/lorenagmad/REC/blob/main/docs/GUIA.md" target="_blank" rel="noopener" style="text-decoration:none" data-t="help"></a>
      <button class="hbtn" id="pNew" data-t="pNew"></button>
      <label class="hbtn" style="display:inline-flex;cursor:pointer"><span data-t="pOpen"></span><input type="file" id="pOpenFile" accept=".json" class="hidden"></label>
      <button class="hbtn" id="pSave" data-t="pSave"></button>
      <div class="lang" role="group" aria-label="Idioma / Language"><button type="button" data-lang="es">ES</button><button type="button" data-lang="en">EN</button></div>
    </div>
  </div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="course"><span class="n">1</span><span data-t="tabCourse"></span></button>
    <button role="tab" data-tab="bank"><span class="n">2</span><span data-t="tabBank"></span></button>
    <button role="tab" data-tab="contests"><span class="n">3</span><span data-t="tabContests"></span></button>
    <button role="tab" data-tab="publish"><span class="n">4</span><span data-t="tabPublish"></span></button>
    <button role="tab" data-tab="results"><span class="n">5</span><span data-t="tabResults"></span></button>
  </nav>
</header>
<main>
  <section id="tab-course" class="tabp"></section>
  <section id="tab-bank" class="tabp hidden"></section>
  <section id="tab-contests" class="tabp hidden"></section>
  <section id="tab-publish" class="tabp hidden"></section>
  <section id="tab-results" class="tabp hidden"></section>
</main>
<div class="modal hidden" id="modal" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>
<div class="rv hidden" id="rv" role="dialog"></div>
<script>
/* ============ REC Estudio ============ */
const TX = {
es:{ studio:'Estudio', help:'Ayuda', pNew:'Nuevo', pOpen:'Abrir proyecto', pSave:'Guardar proyecto', tabCourse:'Curso', tabBank:'Banco de preguntas', tabContests:'Concursos', tabPublish:'Publicar', tabResults:'Resultados',

/* importación desde Moodle XML */
const tfLabel = v => v ? (P.course.language==='en'?'True':'Verdadero') : (P.course.language==='en'?'False':'Falso');
const cleanH = h => (h||'').replace(/<p>\s*(&nbsp;|\s)*<\/p>/g,'').trim();
async function importFiles(files){
  let n=0, skipped=0, ext=0, bigv=0; const errs=[];
  for(const f of files){
    try{
      const text = await f.text();
      const qs = parseMoodle(text, f.name.replace(/\.xml$/i,''));
      for(const q of qs){
        if(P.questions.some(x=>x.name===q.name && strip(x.h)===strip(q.h) && x.type===q.type)){ skipped++; continue; }
        q.media.forEach(m=>{ if(m.url && m.kind==='image') ext++; if(m.kind==='video' && b64size(P.media[m.blob]?.b64||'')>8e6) bigv++; });
        P.questions.push(q); n++;
      }
      skipped += qs.skipped||0;
    }catch(e){ console.error(e); errs.push(t('impErr', f.name)); }
  }
  gcMedia(); touch();
  IMPMSG = [t('impDone', n, skipped, ''), ext?t('impExt',ext):'', bigv?t('impBigVid',bigv):'', ...errs].filter(Boolean).join(' ');
  renderBank();
}
function parseMoodle(text, sourceName){
  const doc = new DOMParser().parseFromString(text, 'application/xml');
  if(doc.querySelector('parsererror')) throw new Error('xml');
  const out = []; out.skipped = 0; let source = sourceName;
  const txt = (el, sel) => { const x = sel ? el.querySelector(sel) : el; return x ? (x.textContent||'') : ''; };
  for(const q of doc.querySelectorAll('quiz > question')){
    const type = q.getAttribute('type');
    if(type==='category'){ const c = txt(q,'category > text').split('/').filter(Boolean).pop(); if(c) source = c.replace(/^\$course\$|^top$/,'') || source; continue; }
    if(!['multichoice','truefalse','matching','shortanswer','ordering'].includes(type)){ out.skipped++; continue; }
    let h = txt(q,':scope > questiontext > text');
    const files = {}; q.querySelectorAll(':scope > questiontext > file').forEach(f=>files[f.getAttribute('name')] = f.textContent.trim());
    const media = [];
    const addBlob = (name, mime) => { const id = uid('m'); P.media[id] = {mime, b64: files[name]}; return id; };
    h.replace(/<img[^>]*src="([^"]+)"[^>]*>/g, (m0, src) => { src = src.replace(/&amp;/g,'&');
      const alt = (m0.match(/alt="([^"]*)"/)||[])[1]||'';
      if(src.startsWith('@@PLUGINFILE@@/')){ const fn = decodeURIComponent(src.slice(15)); if(files[fn]){ const ext=fn.split('.').pop().toLowerCase(); media.push({kind:'image', blob:addBlob(fn, 'image/'+(ext==='jpg'?'jpeg':ext)), alt}); } }
      else media.push({kind:'image', url:src, alt}); return ''; });
    h.replace(/(?:href|src)="@@PLUGINFILE@@\/([^"]+\.(?:mp4|webm|m4v|mov))"/gi, (m0, fn) => { fn = decodeURIComponent(fn.replace(/&amp;/g,'&'));
      if(files[fn] && !media.some(m=>m.file===fn)){ media.push({kind:'video', blob:addBlob(fn, fn.toLowerCase().endsWith('webm')?'video/webm':'video/mp4'), file:fn}); } return ''; });
    h.replace(/<iframe[^>]*src="([^"]+)"/g, (m0, src) => { media.push({kind:'iframe', url:src.replace(/&amp;/g,'&')}); return ''; });
    h = cleanH(h.replace(/<img[^>]*>/g,'').replace(/<a[^>]*@@PLUGINFILE@@[^>]*>[\s\S]*?<\/a>/g,'').replace(/<video[\s\S]*?<\/video>|<iframe[\s\S]*?<\/iframe>/g,''));
    const item = {uid:uid(), name:txt(q,':scope > name > text').trim()||'Pregunta', tema:'', source, h, media, answers:[], shuffle:true, fb:cleanH(txt(q,':scope > generalfeedback > text'))};
    const answers = [...q.querySelectorAll(':scope > answer')];
    if(type==='multichoice' || type==='truefalse'){
      item.type = type==='truefalse' ? 'tf' : (txt(q,':scope > single').trim()==='false' ? 'mm' : 'mc');
      item.shuffle = type!=='truefalse' && ['true','1'].includes(txt(q,':scope > shuffleanswers').trim()||'true');
      item.answers = answers.map(a=>{ let ah = cleanH(txt(a,':scope > text')); if(type==='truefalse') ah = tfLabel(ah.trim()==='true');
        return {h:ah, f:parseFloat(a.getAttribute('fraction'))||0, fb:cleanH(txt(a,':scope > feedback > text')), pin:/todas (son|las)|ninguna de las|anteriores|all of the above|none of the above/i.test(strip(ah))}; });
    } else if(type==='matching'){
      item.type='match'; const sub=[...q.querySelectorAll(':scope > subquestion')].map(s=>({h:cleanH(txt(s,':scope > text')), a:strip(txt(s,':scope > answer > text'))}));
      item.pairs = sub.filter(p=>strip(p.h)); item.extra = sub.filter(p=>!strip(p.h)).map(p=>p.a);
    } else if(type==='shortanswer'){
      item.type='short'; item.case = txt(q,':scope > usecase').trim()==='1';
      item.accept = answers.map(a=>({t:strip(txt(a,':scope > text')), f:parseFloat(a.getAttribute('fraction'))||0, fb:cleanH(txt(a,':scope > feedback > text'))}));
    } else if(type==='ordering'){
      item.type='order'; item.items = answers.sort((a,b)=>(parseFloat(a.getAttribute('fraction'))||0)-(parseFloat(b.getAttribute('fraction'))||0)).map(a=>cleanH(txt(a,':scope > text')));
    }
    out.push(item);
  }
  return out;
}

function skeleton(type){
  const q = {uid:uid(), name:'', tema:BF.topic&&BF.topic!=='∅'?BF.topic:'', source:'', type, h:'', media:[], answers:[], shuffle:true, fb:''};
  if(type==='mc'||type==='mm') q.answers=[0,1,2,3].map(i=>({h:'', f:i===0?100:0, fb:'', pin:false}));
  if(type==='tf'){ q.answers=[{h:tfLabel(true),f:100,fb:'',pin:false},{h:tfLabel(false),f:0,fb:'',pin:false}]; q.shuffle=false; }
  if(type==='match'){ q.pairs=[{h:'',a:''},{h:'',a:''},{h:'',a:''}]; q.extra=[]; }
  if(type==='order') q.items=['','',''];
  if(type==='short'){ q.accept=[{t:'',f:100,fb:''}]; q.case=false; }
  if(type==='hot') q.regions=[];
  return q;
}

      <div class="row"><button class="btn sm alt" id="eAddS">${t('eAddAcc')}</button><label class="check"><input type="checkbox" id="eCase" ${q.case?'checked':''}> ${t('eCase')}</label></div><p class="note">${t('eAcceptHint')}</p>`;

function bindEditor(){
  const q = E, on=(id,ev,f)=>$(id)&&($(id)[ev]=f), all=(sel,f)=>document.querySelectorAll('#sheet '+sel).forEach(f);
  on('eX','onclick',closeEditor); on('eCancel','onclick',closeEditor);

  all('[data-ah]',el=>el.oninput=()=>q.answers[+el.dataset.ah].h=esc(el.value)); all('[data-afb]',el=>el.oninput=()=>q.answers[+el.dataset.afb].fb=esc(el.value));
  all('[data-pin]',el=>el.onchange=()=>q.answers[+el.dataset.pin].pin=el.checked); all('[data-adel]',el=>el.onclick=()=>{ q.answers.splice(+el.dataset.adel,1); renderEditor(); });

  if($('eTF')){ $('eTF').value = q.answers[0].f>0?'1':'0'; $('eTF').onchange=e=>{ const tr=e.target.value==='1'; q.answers[0].f=tr?100:0; q.answers[1].f=tr?0:100; }; }
  all('[data-pl]',el=>el.oninput=()=>q.pairs[+el.dataset.pl].h=esc(el.value)); all('[data-pr]',el=>el.oninput=()=>q.pairs[+el.dataset.pr].a=el.value.trim());
  all('[data-pdel]',el=>el.onclick=()=>{ q.pairs.splice(+el.dataset.pdel,1); renderEditor(); }); on('eAddP','onclick',()=>{ q.pairs.push({h:'',a:''}); renderEditor(); });
  on('eExtra','oninput',e=>q.extra=e.target.value.split(';').map(s=>s.trim()).filter(Boolean));
  on('eItems','oninput',e=>q.items=e.target.value.split('\n').map(s=>s.trim()).filter(Boolean).map(esc));
  all('[data-st]',el=>el.oninput=()=>q.accept[+el.dataset.st].t=el.value); all('[data-sf]',el=>el.oninput=()=>q.accept[+el.dataset.sf].f=Math.max(0,Math.min(100,+el.value||0)));
  all('[data-sfb]',el=>el.oninput=()=>q.accept[+el.dataset.sfb].fb=esc(el.value)); all('[data-sdel]',el=>el.onclick=()=>{ q.accept.splice(+el.dataset.sdel,1); renderEditor(); });
  on('eAddS','onclick',()=>{ q.accept.push({t:'',f:100,fb:''}); renderEditor(); }); on('eCase','onchange',e=>q.case=e.target.checked);
  all('[data-alt]',el=>el.oninput=()=>q.media[+el.dataset.alt].alt=el.value); all('[data-mdel]',el=>el.onclick=()=>{ q.media.splice(+el.dataset.mdel,1); renderEditor(); });
  all('[data-rf]',el=>el.oninput=()=>q.regions[+el.dataset.rf].f=Math.max(0,Math.min(100,+el.value||0))); all('[data-rdel]',el=>el.onclick=()=>{ q.regions.splice(+el.dataset.rdel,1); renderEditor(); });
  on('eImg','onchange',async e=>{ const f=e.target.files[0]; if(!f) return; const {mime,b64}=await compressImage(f); const id=uid('m'); P.media[id]={mime,b64};
    if(q.type==='hot') q.media=q.media.filter(m=>m.kind!=='image'); q.media.push({kind:'image', blob:id, alt:''}); renderEditor(); });
  on('eVid','onchange',async e=>{ const f=e.target.files[0]; if(!f) return; const b64=await fileB64(f); const id=uid('m'); P.media[id]={mime:f.type||'video/mp4', b64};
    q.media.push({kind:'video', blob:id, file:f.name}); renderEditor(); if(f.size>8e6){ $('eVidWarn').textContent=t('eVidBig', mb(f.size)); $('eVidWarn').classList.remove('hidden'); } });
  on('eLink','onclick',()=>{ const u=prompt(t('eLinkPrompt')); if(!u) return; const e=embedUrl(u); if(!e){ alert(t('eLinkBad')); return; } q.media.push({kind:'iframe', url:e}); renderEditor(); });
  on('eSave','onclick',saveEditor);

    const setAr=()=>hw.style.setProperty('--ar', img.naturalWidth? img.naturalWidth/img.naturalHeight : 1); img.complete?setAr():img.onload=setAr;
    let st=null, ghost=null; const pos=e=>{ const r=hw.getBoundingClientRect(); return {x:Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100)), y:Math.max(0,Math.min(100,(e.clientY-r.top)/r.height*100))}; };
    hw.onpointerdown=e=>{ e.preventDefault(); hw.setPointerCapture(e.pointerId); st=pos(e); ghost=document.createElement('div'); ghost.className='rg'+($('eCircle').checked?' circle':''); hw.appendChild(ghost); };
    hw.onpointermove=e=>{ if(!st) return; const p=pos(e); const r=shapeFrom(st,p); ghost.outerHTML; const tmp=document.createElement('div'); tmp.innerHTML=regionHTML(r,q.regions.length); ghost.replaceWith(ghost=tmp.firstChild); };
    hw.onpointerup=e=>{ if(!st) return; const r=shapeFrom(st,pos(e)); st=null; if((r.shape==='rect'&&r.w>1&&r.h>1)||(r.shape==='circle'&&r.r>1)){ q.regions.push(r); } renderEditor(); };
    function shapeFrom(a,b){ if($('eCircle').checked){ const ar=parseFloat(getComputedStyle(hw).getPropertyValue('--ar'))||1; return {shape:'circle', x:+a.x.toFixed(1), y:+a.y.toFixed(1), r:+Math.hypot(b.x-a.x,(b.y-a.y)/ar).toFixed(1), f:100}; }
      return {shape:'rect', x:+Math.min(a.x,b.x).toFixed(1), y:+Math.min(a.y,b.y).toFixed(1), w:+Math.abs(b.x-a.x).toFixed(1), h:+Math.abs(b.y-a.y).toFixed(1), f:100}; } }
}
function embedUrl(u){ let m;
  if((m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{6,})/))) return `https://www.youtube-nocookie.com/embed/${m[1]}`;
  if((m=u.match(/vimeo\.com\/(?:video\/)?(\d+)/))) return `https://player.vimeo.com/video/${m[1]}`; return null; }
const fileB64 = f => new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result.split(',')[1]); r.onerror=rej; r.readAsDataURL(f); });
async function compressImage(f){
  if(/svg|gif/.test(f.type) || f.size < 250e3) return {mime:f.type||'image/png', b64:await fileB64(f)};
  const url = URL.createObjectURL(f); const img = new Image(); img.src = url; await img.decode();
  const k = Math.min(1, 1600/Math.max(img.naturalWidth, img.naturalHeight)); const c = document.createElement('canvas');
  c.width = Math.round(img.naturalWidth*k); c.height = Math.round(img.naturalHeight*k); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
  const blob = await new Promise(r=>c.toBlob(r,'image/webp',.85)); const out = blob && blob.size < f.size ? blob : f;
  return {mime: out.type||'image/webp', b64: await fileB64(out)};
}
function saveEditor(){
  const q = E, err = m => { $('eErr').textContent=m; $('eErr').classList.remove('hidden'); };
  if(q._text!==undefined && q._text!==E0text) q.h = q._text.split('\n').map(s=>s.trim()).filter(Boolean).map(s=>`<p>${esc(s)}</p>`).join('');
  if(q._fb!==undefined) q.fb = q._fb.split('\n').map(s=>s.trim()).filter(Boolean).map(s=>`<p>${esc(s)}</p>`).join('');
  delete q._text; delete q._fb;
  if(!q.name.trim()) return err(t('vName'));
  if(!strip(q.h)) return err(t('vText'));
  if(q.type==='mc'||q.type==='mm'){ q.answers=q.answers.filter(a=>strip(a.h)); if(q.answers.length<2) return err(t('vTwo')); if(!q.answers.some(a=>a.f>0)) return err(t('vOneOk'));
    if(q.type==='mm'){ const n=q.answers.filter(a=>a.f>0).length; q.answers.forEach(a=>a.f=a.f>0?+(100/n).toFixed(4):0); } }
  if(q.type==='match'){ q.pairs=q.pairs.filter(p=>strip(p.h)&&p.a); if(q.pairs.length<2) return err(t('vPairs')); }
  if(q.type==='order'){ q.items=(q.items||[]).filter(Boolean); if(q.items.length<2) return err(t('vItems')); }
  if(q.type==='short'){ q.accept=q.accept.filter(a=>a.t.trim()); if(!q.accept.some(a=>a.f>=100)) return err(t('vAcc')); }
  if(q.type==='hot' && (!q.media.some(m=>m.kind==='image') || !q.regions.length)) return err(t('vHot'));
  const i = P.questions.findIndex(x=>x.uid===q.uid); if(i>=0) P.questions[i]=q; else P.questions.push(q);
  gcMedia(); touch(); closeEditor(); renderAll();
}

const normPass = s => (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/\s+/g,' ');
async function encrypt(bytes, pass){
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(normPass(pass)), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:300000, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt']);
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, bytes));
  const out = new Uint8Array(28+ct.length); out.set(salt,0); out.set(iv,16); out.set(ct,28); return out;
}
/* zip sin compresión (las imágenes y vídeos ya van comprimidos) */
const CRC = (()=>{ const tb=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; tb[n]=c>>>0; } return d=>{ let c=0xFFFFFFFF; for(let i=0;i<d.length;i++) c=tb[(c^d[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }; })();
function makeZip(files){
  const enc = new TextEncoder(), parts = [], central = []; let off = 0;
  const u16 = v => [v&255,(v>>8)&255], u32 = v => [v&255,(v>>8)&255,(v>>16)&255,(v>>>24)&255];
  for(const f of files){
    const name = enc.encode(f.name), data = typeof f.data==='string' ? enc.encode(f.data) : f.data, crc = CRC(data);
    const head = [...u32(0x04034b50),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0)];
    parts.push(new Uint8Array(head), name, data);
    central.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]), name);
    off += head.length + name.length + data.length;
  }
  const csize = central.reduce((s,p)=>s+p.length,0);
  const end = new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(csize),...u32(off),...u16(0)]);
  return new Blob([...parts, ...central, end], {type:'application/zip'});
}
function contestPack(c){
  const byId = Object.fromEntries(P.questions.map(q=>[q.uid,q])), blobs = {};
  const questions = c.qids.map(id=>byId[id]).filter(Boolean).map(q=>{ const x = structuredClone(q); delete x.uid; delete x.source;
    x.media.forEach(m=>{ if(m.blob && P.media[m.blob]) blobs[m.blob] = P.media[m.blob]; }); return x; });
  return {quiz:{id:c.id, title:c.title, salt:c.salt, adapt:P.adapt, theme:{subtitle:c.name||c.title, intro:c.intro, ok:c.ok, ko:c.ko, timeout:c.timeout}, questions}, blobs};
}
function checks(){
  const errs=[], warns=[];
  if(!P.course.title.trim()) errs.push(t('pErrNoCourse'));
  if(!P.contests.length) errs.push(t('pErrNoContest'));

    const qs = c.qids.map(id=>P.questions.find(q=>q.uid===id)).filter(Boolean);
    if(qs.some(q=>q.media.some(m=>m.kind==='image'&&m.url))) warns.push(t('pWarnExt',n));
    const size = new Set(qs.flatMap(q=>q.media.filter(m=>m.blob).map(m=>m.blob))); let bytes=0; size.forEach(b=>bytes+=b64size(P.media[b]?.b64||'')); if(bytes>10e6) warns.push(t('pWarnSize',n,mb(bytes))); });
  return {errs, warns};
}

function parseTickets(text){
  return text.split(/(?=REC\s*\|)/).map(s=>s.trim()).filter(s=>/^REC\s*\|/.test(s)).map(b=>{ const g = re => ((b.match(re)||[])[1]||'').trim();

/* ---- xAPI (Experience API 1.0.3): una declaración por interacción ---- */
function buildXapi(o){
  // o: {base, lang, platform, quiz:{id,title}, actor:{name,id}, log, start, end, total, max, maxQ, extra, record}
  const hid = s => 'r' + cyrb53(String(s)).toString(36).slice(0,9);
  const L = t => ({[o.lang]: String(t)});
  const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{ const r=Math.random()*16|0; return (c==='x'?r:(r&3|8)).toString(16); }));
  const dur = s => 'PT' + (Math.round((s||0)*10)/10) + 'S';
  const actor = {objectType:'Agent', name:o.actor.name, account:{homePage:o.base, name:o.actor.id}};
  const contest = {objectType:'Activity', id:`${o.base}contests/${encodeURIComponent(o.quiz.id)}`, definition:{type:'http://adlnet.gov/expapi/activities/assessment', name:L(o.quiz.title)}};
  const ctx = (extra) => ({platform:o.platform, language:o.lang, contextActivities:{parent:[{objectType:'Activity', id:contest.id}]},
    extensions:{[`${o.base}xapi/extra-time`]: o.extra||0, ...(extra||{})}});
  const verb = (v, es, en) => ({id:`http://adlnet.gov/expapi/verbs/${v}`, display:{'es-ES':es, 'en-US':en}});
  const st = [{id:uuid(), actor, verb:verb('attempted','intentó','attempted'), object:contest, context:{platform:o.platform, language:o.lang, extensions:{[`${o.base}xapi/extra-time`]: o.extra||0}}, timestamp:o.start}];
  o.log.forEach((l,i)=>{
    const def = {type:'http://adlnet.gov/expapi/activities/cmi.interaction', name:L(l.name), description:L(l.q||l.name)};
    let resp = '';
    const sel = l.sel||[], good = l.good||[];
    if(l.tipo==='mc' || l.tipo==='mm'){ def.interactionType='choice'; def.choices=(l.opciones||[]).map(x=>({id:hid(x), description:L(x)}));
      def.correctResponsesPattern=[good.map(hid).join('[,]')]; resp = sel.map(hid).join('[,]'); }
    else if(l.tipo==='tf'){ const tv = x => /^(verdadero|true)/i.test(String(x).trim()) ? 'true' : 'false'; def.interactionType='true-false'; def.correctResponsesPattern=[good[0]?tv(good[0]):'true']; resp = sel[0]?tv(sel[0]):''; }
    else if(l.tipo==='match'){ const sp = x => String(x).split(' → '); const src=[...new Set(good.map(g=>sp(g)[0]))], tgt=[...new Set([...good, ...sel].map(g=>sp(g)[1]).filter(Boolean))];
      def.interactionType='matching'; def.source=src.map(x=>({id:hid(x), description:L(x)})); def.target=tgt.map(x=>({id:hid(x), description:L(x)}));
      def.correctResponsesPattern=[good.map(g=>hid(sp(g)[0])+'[.]'+hid(sp(g)[1])).join('[,]')]; resp = sel.map(g=>hid(sp(g)[0])+'[.]'+hid(sp(g)[1]||'')).join('[,]'); }
    else if(l.tipo==='order'){ const items=(good[0]||'').split(' → '); def.interactionType='sequencing'; def.choices=items.map(x=>({id:hid(x), description:L(x)}));
      def.correctResponsesPattern=[items.map(hid).join('[,]')]; resp = sel[0] ? sel[0].split(' → ').map(hid).join('[,]') : ''; }
    else if(l.tipo==='short'){ def.interactionType='fill-in'; def.correctResponsesPattern=good.slice(); resp = sel[0]||''; }
    else { def.interactionType='other'; resp = sel[0]||''; }
    const res = {success: !!l.ok, response: resp, score:{raw:l.pts||0, min:0, max:o.maxQ, scaled:+((l.pts||0)/o.maxQ).toFixed(4)},
      extensions:{[`${o.base}xapi/result`]: l.res, [`${o.base}xapi/time-limit`]: l.limite??null}};
    if(l.t!=null) res.duration = dur(l.t);
    st.push({id:uuid(), actor, verb:verb('answered','respondió','answered'), object:{objectType:'Activity', id:`${contest.id}/questions/${encodeURIComponent(l.name)}`, definition:def},
      result:res, context:ctx({[`${o.base}xapi/topic`]: l.tema||'', [`${o.base}xapi/position`]: i+1}), timestamp:l.at||o.end});
  });
  const secs = Math.max(0,(Date.parse(o.end)-Date.parse(o.start))/1000);
  st.push({id:uuid(), actor, verb:verb('completed','completó','completed'), object:contest,
    result:{completion:true, duration:dur(secs), score:{raw:o.total, min:0, max:o.max, scaled:+(o.total/o.max).toFixed(4)}, extensions:{[`${o.base}xapi/record`]: o.record}},
    context:ctx(), timestamp:o.end});
  return st;
}
/* lee un archivo de resguardo: formato propio o xAPI (lista de declaraciones con el registro en «completed») */
function recordFromFile(o){
  if(!Array.isArray(o)) return {record:o, statements:null};
  for(const s of o){ const ex = s && s.result && s.result.extensions; if(!ex) continue;
    const k = Object.keys(ex).find(k=>/\/xapi\/record$/.test(k)); if(k) return {record:ex[k], statements:o}; }
  return {record:null, statements:o};
}
/* anonimiza una lista de declaraciones (para exportar a un LRS o a un estudio) */
function anonStatements(list, anonOf){
  return list.map(s=>{ const c = structuredClone(s); const id = c.actor && c.actor.account ? c.actor.account.name : '';
    const a = anonOf(id); c.actor = {objectType:'Agent', account:{homePage:c.actor.account.homePage, name:a}};
    const ex = c.result && c.result.extensions; if(ex){ const k = Object.keys(ex).find(k=>/\/xapi\/record$/.test(k)); if(k) delete ex[k]; }
    return c; });
}

const whoA = f => AN.anon ? f.anon : f.name;
function classify(F){ const byQ={}; F.forEach(f=>f.detail.forEach(d=>{ if(d.rel!=null) (byQ[f.c.uid+'|'+d.id] ||= []).push(d.rel); }));
  F.forEach(f=>f.detail.forEach(d=>{ const med=median(byQ[f.c.uid+'|'+d.id]||[]), fast=d.rel!=null&&med!=null&&d.rel<=med;
    d.cat = d.result==='acierto' ? (fast?'domina':'duda') : d.result==='tiempo' ? 'nosabe' : (fast?'precipita':'nosabe'); })); }

function qStats(F){
  const qm=new Map(), N=F.length, srt=[...F].sort((a,b)=>b.points-a.points), half=Math.floor(N/2);
  const up=new Set(srt.slice(0,half).map(f=>f.sid)), lo=new Set(srt.slice(N-half).map(f=>f.sid));
  F.forEach(f=>f.detail.forEach(d=>{ if(!qm.has(d.id)) qm.set(d.id,{id:d.id, text:d.question, topic:d.topic, good:d.answer, options:d.options, rows:[]}); qm.get(d.id).rows.push({...d, who:f}); }));
  return [...qm.values()].map(q=>{ const n=q.rows.length, c=k=>q.rows.filter(r=>r.result===k).length, times=q.rows.filter(r=>r.seconds!=null).map(r=>r.seconds);
    const hot = q.rows.some(r=>r.type==='hot'), wrong={}, chosen={};
    if(hot){ chosen[q.good[0]] = q.rows.filter(r=>r.result==='acierto').length; const out = q.rows.filter(r=>r.result!=='acierto' && r.result!=='tiempo').length; if(out) chosen[t('anHotOut')] = out; }
    else { q.rows.filter(r=>r.result!=='acierto').forEach(r=>r.chosen.filter(e=>!q.good.includes(e)).forEach(e=>wrong[e]=(wrong[e]||0)+1)); q.rows.forEach(r=>r.chosen.forEach(e=>chosen[e]=(chosen[e]||0)+1)); }
    let disc=null; if(half>=2){ const rate=s=>{ const r=q.rows.filter(x=>s.has(x.who.sid)); return r.length? r.filter(x=>x.result==='acierto').length/r.length : 0; }; disc=rate(up)-rate(lo); }
    return {...q, n, ok:c('acierto'), part:c('parcial'), ko:c('fallo'), to:c('tiempo'), pOk:n?c('acierto')/n:0, tAvg:avg(times), topWrong:Object.entries(wrong).sort((a,b)=>b[1]-a[1])[0], chosen, disc, pPrec:n?q.rows.filter(r=>r.cat==='precipita').length/n:0}; });
}
function scatter(F){

      <div class="kpi"><b>${tot?pctS(to/tot):'–'}</b><span>${t('anTo')}</span></div></div>
    <h2 style="font-size:16px">${t('anIdeas')}</h2><ul class="ideas">${ideas.map(i=>`<li>${i}</li>`).join('')}</ul><div class="row"><button class="btn rec" id="rvOpen">${t('anReview')}</button><span class="note">${t('anAddImg')}</span></div></div>
  <div class="box"><h2>${t('anMap')}</h2><p class="note">${t('anMapNote')}</p>${scatter(F)}</div>
  <div class="box"><div class="row" style="justify-content:space-between"><h2>${t('anByQ')}</h2><select id="anOrd" style="width:auto"><option value="dif">↑ ${t('anHard')}</option><option value="ord">A–Z</option></select></div>
    <div class="legend"><span><i style="background:var(--g)"></i>${t('anOk')}</span><span><i style="background:#9ED8AC"></i>${t('anPart')}</span><span><i style="background:var(--m)"></i>${t('anKo')}</span><span><i style="background:#A7ADB6"></i>${t('anToL')}</span></div>
    ${sorted.map(q=>{ const [lc,lt]=lvl(q.pOk), w=k=>q.n?q[k]/q.n*100:0; return `<div class="qa"><div class="top"><div><b>${esc(q.text)}</b><div class="ic">${esc(q.id)}. ${t('anTopic')} ${esc(q.topic)}. ${t('anCorrect')} ${esc(q.good.join(' + '))}</div></div>

  <div class="box"><h2>${t('anByS')}</h2><div class="legend">${Object.keys(CATC).map(k=>`<span><i style="background:${CATC[k]}"></i>${C[k]}</span>`).join('')}</div>
    <div style="overflow-x:auto"><table class="dtable"><thead><tr>${t('anColS').map((h,i)=>`<th class="${[1,2,3].includes(i)?'num':''}">${h}</th>`).join('')}</tr></thead><tbody>
    ${F.map(f=>{ const tt=f.detail.filter(d=>d.seconds!=null).map(d=>d.seconds), k=cnt(f), miss=f.detail.filter(d=>d.result!=='acierto'), al=(k.precipita||0)>=2&&(k.precipita||0)/f.detail.length>=.25;
      return `<tr><td>${esc(whoA(f))}<div class="ic">${AN.anon?'':esc(f.sid)} ${f.extra?t('anExtraT',f.extra):''}</div></td><td class="num">${f.correct}/${f.questions}</td><td class="num">${fmt(f.points)}</td><td class="num">${tt.length?avg(tt).toFixed(1)+' s':'–'}</td>

  $('csvS').onclick=()=>csv(`analysis-students-${c.id}${AN.anon?'-anon':''}.csv`,[[...(AN.anon?['anon_id']:['name','id','anon_id']),'correct','questions','points','extra_time','avg_seconds','masters','hesitates','rushes','needs_review','missed'],
    ...F.map(f=>{ const tt=f.detail.filter(d=>d.seconds!=null).map(d=>d.seconds), k=cnt(f); return [...(AN.anon?[f.anon]:[f.name,f.sid,f.anon]),f.correct,f.questions,f.points,f.extra||0,dec(avg(tt),1),k.domina||0,k.duda||0,k.precipita||0,k.nosabe||0,f.detail.filter(d=>d.result!=='acierto').map(d=>d.question).join(' | ')]; })]);
}
function anCourse(){
  const F=AN.files; classify(F); const all=F.flatMap(f=>f.detail.map(d=>({...d,f}))), T={};
  all.forEach(d=>{ const x=T[d.topic] ||= {topic:d.topic,n:0,ok:0,prec:0}; x.n++; if(d.result==='acierto') x.ok++; if(d.cat==='precipita') x.prec++; });
  const TT=Object.values(T).map(x=>({...x,p:x.ok/x.n})).sort((a,b)=>a.p-b.p), ret=[];
  [...new Set(F.map(f=>f.c.section||''))].forEach(s=>{ const ses=all.filter(d=>(d.f.c.section||'')===s&&!d.f.c.global), glo=all.filter(d=>(d.f.c.section||'')===s&&d.f.c.global); if(!ses.length||!glo.length) return;
    [...new Set(glo.map(d=>d.topic))].forEach(tp=>{ const a=ses.filter(d=>d.topic===tp), g=glo.filter(d=>d.topic===tp); if(!a.length) return;
      const both=[...new Set(g.map(d=>d.f.sid))].filter(x=>a.some(d=>d.f.sid===x)); const rate=arr=>arr.length?arr.filter(d=>d.result==='acierto').length/arr.length:0;
      if(both.length){ const sa=rate(a.filter(d=>both.includes(d.f.sid))), ga=rate(g.filter(d=>both.includes(d.f.sid))); ret.push({s,tp,n:both.length,sa,ga,d:ga-sa}); } }); });
  ret.sort((a,b)=>a.d-b.d);
  const st={}; all.forEach(d=>{ const s=st[d.f.sid] ||= {f:d.f,t:{}}; const x=s.t[d.topic] ||= {n:0,ok:0}; x.n++; if(d.result==='acierto') x.ok++; });
  const S=Object.values(st).map(s=>({f:s.f, weak:Object.entries(s.t).filter(([k,v])=>v.n>=2&&v.ok/v.n<.5).map(([k,v])=>`${k} (${v.ok}/${v.n})`), n:Object.values(s.t).reduce((a,v)=>a+v.n,0), ok:Object.values(s.t).reduce((a,v)=>a+v.ok,0)})).sort((a,b)=>a.ok/a.n-b.ok/b.n);
  const col=p=>p>=.8?'var(--g)':p>=.5?'var(--y)':'var(--m)', h=t('anRetCols');
  $('anOut').innerHTML = `<div class="box"><h2>${t('anTopics')}</h2><p class="note">${t('anTopicsNote',all.length,F.length)}</p>${TT.map(x=>`<div class="tema"><span>${esc(x.topic)} <span class="ic">(${x.n})</span></span><div class="tb"><span style="width:${x.p*100}%;background:${col(x.p)}"></span></div><b class="num">${pctS(x.p)}</b></div>`).join('')}</div>

    ${ret.map(r=>`<tr><td>${esc(r.s||t('sec'))}</td><td>${esc(r.tp)}</td><td class="num">${r.n}</td><td class="num">${pctS(r.sa)}</td><td class="num">${pctS(r.ga)}</td><td class="num ${r.d>=.05?'up':r.d<=-.05?'down':''}">${r.d>=0?'▲':'▼'} ${Math.abs(Math.round(r.d*100))}</td></tr>`).join('')}</tbody></table></div>`:`<p class="note">${t('anRetNone')}</p>`}</div>
  <div class="box"><h2>${t('anByS')}</h2><div style="overflow-x:auto"><table class="dtable"><thead><tr><th>${t('anColS')[0]}</th><th class="num">${t('anAnswers')}</th><th class="num">${t('anPct')}</th><th>${t('anWeak')}</th></tr></thead><tbody>
    ${S.map(s=>`<tr><td>${esc(whoA(s.f))}</td><td class="num">${s.n}</td><td class="num">${pctS(s.ok/s.n)}</td><td class="ic">${s.weak.length?s.weak.map(esc).join('<br>'):t('anNone')}</td></tr>`).join('')}</tbody></table></div>
    <div class="row"><button class="btn" id="csvT">${t('anCsvT')}</button><button class="btn alt" id="csvR">${t('anCsvR')}</button></div></div>`;

}
/* repaso en clase con las imágenes del banco */
function review(c, qs){
  const list=[...qs].sort((a,b)=>a.pOk-b.pOk).filter(q=>q.pOk<1); if(!list.length){ alert(t('rvNothing')); return; }
  const byName=Object.fromEntries(c.qids.map(id=>P.questions.find(q=>q.uid===id)).filter(Boolean).map(q=>[q.name,q]));
  let i=0, shown=false; const rv=$('rv');
  const paint=()=>{ const q=list[i], bq=byName[q.id], im=bq&&bq.media.find(m=>m.kind==='image'), opts=q.options.length?q.options:[...new Set([...q.good,...Object.keys(q.chosen)])], n=q.n||1;
    rv.innerHTML=`<div class="row" style="justify-content:space-between;font-weight:700"><span>● REC · ${t('rvTitle')} · ${esc(c.name||c.title)}</span><span>${i+1} / ${list.length}</span></div>
      <div class="slide"><div class="qt">${esc(q.text)}</div>${im?`<img class="qimg" alt="" src="${mediaSrc(im)}">`:''}
      <div style="display:grid;gap:10px">${opts.map(o=>{ const k=q.chosen[o]||0, g=q.good.includes(o); return `<div class="opt ${shown&&g?'good':''}"><div class="ol"><span>${esc(o)}</span><span>${k} (${pctS(k/n)})</span></div><div class="ob"><span style="width:${k/n*100}%"></span></div></div>`; }).join('')}</div>
      ${shown?`<div style="font-weight:700;font-size:20px">${t('rvGroup',pctS(q.pOk))}</div>`:''}</div>
      <div class="foot"><button class="btn" id="rvP" ${i?'':'disabled'}>${t('rvPrev')}</button><button class="btn" id="rvS" style="background:var(--y)">${shown?t('rvHide'):t('rvShow')}</button><button class="btn" id="rvN">${i===list.length-1?t('rvEnd'):t('rvNext')}</button><button class="btn" id="rvX">${t('close')}</button></div>`;
    $('rvP').onclick=()=>{ if(i){i--;shown=false;paint();} }; $('rvN').onclick=()=>{ if(i<list.length-1){i++;shown=false;paint();} else close(); }; $('rvS').onclick=()=>{shown=!shown;paint();}; $('rvX').onclick=close; };
  const key=e=>{ if(e.key==='ArrowRight') $('rvN').click(); else if(e.key==='ArrowLeft') $('rvP').click(); else if(e.key===' '){e.preventDefault(); $('rvS').click();} else if(e.key==='Escape') close(); };
  function close(){ rv.classList.add('hidden'); document.removeEventListener('keydown',key); if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); }
  rv.classList.remove('hidden'); document.addEventListener('keydown',key); paint(); if(rv.requestFullscreen) rv.requestFullscreen().catch(()=>{});
}
